# ProtoPathway Configuration File

# Base paths
base_dir: "C:/Users/Amaya/Documents/PhD/ProtoPathway"
output_dir: "${base_dir}/output"

# Dataset name
dataset_name: "R4RA" # choices: ['R4RA', 'Sjogren']
label: 'label'
label_dict: {'0': 'Pauci-Immune', '1': 'Lymphoid/Myeloid'}
n_classes: 2
patient_id: 'Patient_ID'

# Execution mode
execution:
  mode: "multimodal"  # choices: ["gene_expression", "wsi", "multimodal"]
  ge_preprocess: false
  wsi_preprocess: false
  wsi_segmentation: false
  create_splits: false
  cross_validation: false
  full_train: true
  test: false
  visualise: false

## Model configuration
#model:
#  name: 'ProtoPathway' # choices ['MLP', 'Hypergraph', 'ProtoNet', 'MultiModal']

# Gene Expression specific configuration
gene_expression:
  enabled: true  # Set to false to disable gene expression branch
  model: 'Hypergraph'  # Gene expression model to use - Choices: ['MLP', 'Hypergraph']
  input:
    gtf_file: "${base_dir}/input_files/Homo_sapiens.GRCh38.113.gtf"
    gene_expression: "${base_dir}/input_files/gene_expression_${dataset_name}_cpm.csv"
    reactome_gmt: "${base_dir}/input_files/ReactomePathways.gmt"
    reactome_relations: "${base_dir}/input_files/ReactomePathwaysRelation.txt"
    reactome_pathways: "${base_dir}/input_files/ReactomePathways.txt"
  parameters:
    threshold: 1
    min_proportion: 0.10
    variance_proportion: 0.80
  pathway:
    min_genes: 3
    max_genes: 500
    similarity_threshold: 1.0
    target_depth: 5
    max_visualization: 200

# WSI specific configuration
wsi:
  enabled: true  # Set to true to enable WSI branch
  model: 'Prototype'  # WSI model to use
  input:
    slides_dir: "${base_dir}/input_files/slides/${dataset_name}"
    masks_dir: "${base_dir}/input_files/masks/${dataset_name}"
  parameters:
    patch_size: 224
    overlap: 0
    coverage: 0.4  # percent of tissue coverage in the patch
    slide_level: 2
    mask_level: 2
    patch_batch_size: 10
    stain_used: 'all'  # RA choices: ['all', 'H&E', 'CD68', 'CD138', 'CD20']
  prototype:
    num_prototypes: 50
    backbone: "UNI"
    pretrained: true
    freeze_backbone: false

# Multimodal fusion
multimodal:
  enabled: true  # Set to true to enable multimodal fusion
  fusion_type: "attention"  # choices: ["concat", "attention", "weighted"]
  fusion_layers: 2
  hidden_dim: 128

# Input files
input:
  dir: "${base_dir}/input_files"
  patient_labels: "patient_labels_${dataset_name}.csv"

# Output directory structure
output:
  data:
    dir: "${output_dir}/processed_data"
    gene_annotations: "${output_dir}/processed_data/gene_annotations.csv"
    filtered_genes: "${output_dir}/processed_data/gene_expression_filtered_${dataset_name}.csv"
    reactome_pathways: "${output_dir}/processed_data/reactome_pathways_gene_lists.csv"
    final_pathways: "${output_dir}/processed_data/final_filtered_reactome_pathways.csv"
    wsi_features: "${output_dir}/processed_data/embedding_dict_${dataset_name}_UNI_all.pkl"
    wsi_patches: "${output_dir}/processed_data/wsi_patches_${dataset_name}.csv"
    wsi_centroids: "${output_dir}/processed_data/wsi_centroids_${dataset_name}.pt"
  figures:
    dir: "${output_dir}/figures/"
  reports:
    dir: "${output_dir}/reports/"
    removed_pathways: "${output_dir}/reports/removed_pathways_report.csv"
    removed_pathways_md: "${output_dir}/reports/removed_pathways_report.md"

testing:
  experiment_path: "${output_dir}/experiments/Hypergraph_FT_ds-R4RA_lr-1.0e-3_bs-1_dr-0.5_l1-0_l2-0_20250430_184419"

# Dataset configurations
dataset:
  train_fraction: 0.8
  val_fraction: 0.20
  split_seed: 42
  stratified_splits: 5

# Parsing configurations for WSI
parsing:
  patient_ID: 'img.split("_")[0]'
  stain: 'img.split("_")[1]'
  stain_types: {'NA': 0, 'H&E': 1, 'CD68': 2, 'CD138': 3, 'CD20': 4}
  stain_colors: {'H&E': 'tab:pink', 'CD68': 'tab:brown', 'CD20': 'tab:blue', 'CD138': 'tab:orange'}

training:
  batch_size: 1
  slide_batch: 1
  num_workers: 0
  num_epochs: 200
  checkpoint: true
  weight_type: 'accuracy'  # choices: ['accuracy', 'loss', 'auc']
  seed: 42

# Training settings
ge_training:
  input_dim: 1
  hidden_dim: 128
  num_layers: 3
  learning_rate: 0.001
  dropout_rate: 0.2
  L2_norm: 0
  L1_norm: 0
  num_workers: 0

wsi_training:
  input_dim: 1024
  hidden_dim: 128
  learning_rate: 0.00001
  L2_norm: 0.001
  L1_norm: 0.001
  num_prototypes: 64
  tau: 10.0
  batch_size: 1
  slide_batch: 1
  num_workers: 0
  attention_heads: 1

mm_training:
  input_dim: 1024
  hidden_dim: 128
  learning_rate: 0.00001
  L2_norm: 0.001
  L1_norm: 0.001
  num_prototypes: 64
  tau: 10.0
  dropout_rate: 0.2
  batch_size: 1
  slide_batch: 1
  num_workers: 0
  attention_heads: 1

scheduler:
  use: false
  type: step
  step: 10
  gamma: 0.1
  patience: 5
  min_lr: 1e-6

# Visualization configurations
visualization:
  test_fold: 0
  test_ids: null
  specific_ids: false

# Embedding models configs & paths
embedding_net:
  UNI:
    size: 1024
    weight_path: ""
    class: "UNI_embedding"

# Mapping of class names to module paths
embedding_class:
  UNI_embedding: "models.embedding_models.UNI_embedding"