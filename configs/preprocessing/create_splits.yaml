# =============================================================================
# Create Splits and Labels Configuration (Stage 3)
# =============================================================================
# Finds shared patients between gene expression and WSI data.
# Processes labels (classification or survival discretization).
# Either loads predefined TCGA splits or generates new stratified splits.
#
# Run after: preprocess_genes.py, preprocess_wsi.py
# Usage: python main.py preprocess splits --config configs/preprocessing/create_splits.yaml
# =============================================================================

dataset: TCGA-BLCA  # choices: [TCGA-BLCA, TCGA-BRCA, TCGA-HNSC, TCGA-STAD, TCGA-COADREAD]

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  base_data_dir: C:/Users/Amaya/Documents/PhD/Data/TGCA_data
  output_dir: C:/Users/Amaya/Documents/PhD/ProtoPathway_results
  processed_dir: ${paths.output_dir}/processed/${dataset}

# -----------------------------------------------------------------------------
# Input (outputs from Stage 2 preprocessing)
# -----------------------------------------------------------------------------
input:
  gene_expression: ${paths.processed_dir}/gene_expression.csv # From preprocess_genes.py
  wsi_patient_ids: ${paths.processed_dir}/wsi_patient_ids.csv # From preprocess_wsi.py
  clinical_csv: ${paths.base_data_dir}/${dataset}/${dataset}.csv # Clinical data with survival/label info

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  splits: ${paths.processed_dir}/data_splits.pkl
  labels: ${paths.processed_dir}/labels.csv
  shared_patient_ids: ${paths.processed_dir}/shared_patient_ids.csv

# -----------------------------------------------------------------------------
# Column Names
# -----------------------------------------------------------------------------
patient_id_col: case_id          # Column name for patient ID in clinical CSV

# -----------------------------------------------------------------------------
# Task Configuration
# -----------------------------------------------------------------------------
task: survival  # choices: [survival, classification]

# Survival task settings
survival:
  time_col: survival_months      # Column name for survival time
  event_col: censorship          # Column name for event indicator (1=event, 0=censored)
  num_bins: 4                    # Number of risk bins for discretization

# Classification task settings (used if task: classification)
classification:
  label_col: label               # Column name for classification label

# -----------------------------------------------------------------------------
# Split Configuration
# -----------------------------------------------------------------------------
splits:
  # Use predefined TCGA splits (recommended for survival benchmarking)
  use_predefined: true

  # Path to predefined splits (e.g., from SurvPath repository)
  # Expected format: splits_0.csv, splits_1.csv, ... with columns [train, val, test]
  predefined_dir: ${paths.base_data_dir}/${dataset}/splits

  # If use_predefined: false, generate splits with these settings
  generate:
    test_fraction: 0.0           # 0 = pure CV (matches TCGA predefined format), >0 = held-out test set
    num_folds: 5                 # Number of CV folds
    seed: 42                     # Random seed for reproducibility

